[project]
name = "picurate-toolkit"
version = "0.1.0"
description = "Deduplication, tagging and dataset editing for very large image collections."
authors = [{name = "Neo_Chen", email = "chenkolei@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "click",
    "huggingface_hub",
    "humanize",
    "numpy",
    "pillow",
    "safetensors",
    "timm",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
# The PySide6 GUIs (picurate-dedupe-review). The CLIs never import Qt.
gui = ["PySide6>=6.7"]
# Dataset preprocessing and CLIP fine-tuning scripts (src/clip_training), not needed for deduplication.
training = [
    "accelerate",
    "datasets",
    "jsonlines",
    "prodigy-plus-schedule-free",
    "prodigyopt",
    "reflink",
    "rich",
    "safetensors",
    "tensorboard",
    "transformers",
]

[project.scripts]
picurate-dedupe = "picurate.dedupe.cli:cli"
picurate-dedupe-review = "picurate.dedupe.gui.app:main"
picurate-tag = "picurate.tagger.cli:main"
clip-dataset-preprocess = "clip_training.dataset_preprocessing:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"picurate.dedupe" = ["policies.toml"]

[tool.black]
line-length = 132
target-version = ['py311']

[tool.isort]
profile = "black"
