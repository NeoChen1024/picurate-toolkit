[project]
name = "clip-image-deduper"
version = "0.1.0"
description = "Image deduplication by CLIP embedding similarity."
authors = [{name = "Neo_Chen", email = "chenkolei@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "click",
    "huggingface_hub",
    "humanize",
    "numpy",
    "pillow",
    "safetensors",
    "timm",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
# The PySide6 review GUI (clip-image-deduper-review). The CLI never imports Qt.
gui = ["PySide6>=6.7"]
# Dataset preprocessing and CLIP fine-tuning scripts (src/clip_training), not needed for deduplication.
training = [
    "accelerate",
    "datasets",
    "jsonlines",
    "prodigy-plus-schedule-free",
    "prodigyopt",
    "reflink",
    "rich",
    "safetensors",
    "tensorboard",
    "transformers",
]

[project.scripts]
clip-image-deduper = "clip_image_deduper.cli:cli"
clip-image-deduper-review = "clip_image_deduper.gui.app:main"
clip-dataset-preprocess = "clip_training.dataset_preprocessing:main"
vit-tagger = "vit_tagger.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clip_image_deduper = ["policies.toml"]

[tool.black]
line-length = 132
target-version = ['py311']

[tool.isort]
profile = "black"
