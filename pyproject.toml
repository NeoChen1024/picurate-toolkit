[project]
name = "picurate-toolkit"
version = "0.1.0"
description = "Deduplication, tagging and dataset editing for very large image collections."
authors = [{name = "Neo_Chen", email = "chenkolei@gmail.com"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "blake3",
    "click",
    "huggingface_hub",
    "humanize",
    "numpy",
    "pillow",
    "safetensors",
    "timm",
    "torch>=2.10",
    "torchvision>=0.25",
    "tqdm",
]

[project.optional-dependencies]
# The PySide6 GUIs (picurate-curate, picurate-dataset-editor). The CLIs never import Qt.
gui = ["PySide6>=6.7", "tokenizers"]
# Mask generation for the dataset editor's LaMa repair; Hi-SAM and SAM 2 themselves are installed from source by
# `python -m picurate.dataset_editor.install_repair`.
repair = ["einops", "hydra-core", "iopath", "setuptools"]
# Formatting: Black and isort, configured below.
dev = ["black", "isort"]
# CLIP fine-tuning scripts (src/clip_training), not needed for deduplication.
training = [
    "schedulefree",
    "tensorboard>=2.21",
    "tokenizers",
]

[project.scripts]
picurate-dedupe = "picurate.dedupe.cli:cli"
picurate-curate = "picurate.curate.app:main"
picurate-tag = "picurate.tagger.cli:main"
picurate-project = "picurate.project.cli:main"
picurate-dataset-editor = "picurate.dataset_editor.app:main"
clip-train-bench = "clip_training.bench_train:main"
clip-pack = "clip_training.pack:main"
clip-data = "clip_training.data:main"
clip-train = "clip_training.train:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"picurate.dedupe" = ["policies.toml"]
"picurate.dataset_editor" = ["data/*.csv"]

[tool.black]
line-length = 132
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 132
